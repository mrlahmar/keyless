name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keyless deliberately does one thing, pausing the keyboard while the mouse keeps working. Requests that make that better are very welcome.
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: Describe the situation you're in, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
