name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keyless version
      description: Shown at the bottom of the settings window.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Keyboard and other details
      description: Keyboard type (built-in, USB, Bluetooth), keyboard layout, assistive tools in use, or anything else that might matter.
