name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev appstream
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Validate AppStream metadata
        run: |
          # The release list is filled in at packaging time.
          file="$RUNNER_TEMP/io.github.mrlahmar.Keyless.metainfo.xml"
          sed '/@RELEASES@/d' packaging/linux/io.github.mrlahmar.Keyless.metainfo.xml > "$file"
          appstreamcli validate --no-net "$file"

  # Keeps the core and the platform API compiling where no backend exists yet.
  portable:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p keyless-core -p keyless-platform --all-targets --locked
      - run: cargo test -p keyless-core --locked
