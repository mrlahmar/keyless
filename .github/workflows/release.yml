name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $version = ((cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages | Where-Object name -eq 'keyless').version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Install Inno Setup
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$env:VERSION\]").LineNumber
          if (-not $start) { throw "No CHANGELOG.md section for $env:VERSION" }
          $end = ($lines[$start..($lines.Length - 1)] | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $body = if ($end) { $lines[$start..($start + $end - 2)] } else { $lines[$start..($lines.Length - 1)] }
          $body | Where-Object { $_ -notmatch '^\[.*\]: ' } | Set-Content release-notes.md

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          files: dist/*
