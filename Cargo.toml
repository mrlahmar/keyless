[workspace]
resolver = "3"
members = ["crates/keyless-core", "crates/keyless-platform", "crates/keyless-app"]
default-members = ["crates/keyless-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mrlahmar/keyless"

[workspace.dependencies]
keyless-core = { path = "crates/keyless-core" }
keyless-platform = { path = "crates/keyless-platform" }
serde = { version = "1", features = ["derive"] }
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
